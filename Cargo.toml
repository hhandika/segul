[workspace]
members = ["crates/segul-core"]

[workspace.package]
version = "0.24.0"
authors = ["Heru Handika <herubiolog@gmail.com>"]
edition = "2024"
license = "MIT"
description = "An ultrafast and memory-efficient tool for phylogenomics"
homepage = "https://www.segul.app/"
repository = "https://github.com/hhandika/segul"

[workspace.dependencies]
segul-core = { path = "crates/segul-core", version = "0.24.0", default-features = false }
ahash = "0.8.*"
anyhow = "1.0.*"
bytecount = "0.6.*"
colored = "3.1.*"
chrono = "0.4.*"
dialoguer = "0.*"
glob = "0.3.*"
indexmap = "2.*"
indicatif = "0.18.*"
lazy_static = "1.*"
log = "0.*"
log4rs = "1.*"
memchr = "2.*"
nom = "8.*"
num-format = "0.*"
rayon = "1.*"
regex = "1.*"
clap = { version = "4.6.*", features = ["cargo", "derive"] }
noodles = { version = "0.118.*" }
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
assert_approx_eq = "1.1.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
alphanumeric-sort = "1.5.8"
csv = "1.4.0"
assert_cmd = "2.*"
predicates = "3.*"
tempfile = "3.27.0"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series", "area_series", "histogram"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
usvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
svg2pdf = { version = "0.13.0", default-features = false, features = ["text"] }
colorous = "1.0.16"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(docsrs)'] }

[package]
name = "segul"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cli", "utility", "alignment", "genomics", "phylogenomics"]
categories = ["command-line-utilities", "science"]
exclude = ["crates/", "bench/"]

[dependencies]
segul-core = { workspace = true, features = ["align", "sequence", "read", "contig", "maf", "plot"] }
clap.workspace = true
colored.workspace = true
dialoguer.workspace = true
glob.workspace = true
log.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
zip.workspace = true
tempfile.workspace = true

[profile.release]
debug = false
lto = "fat"
panic = "abort"

[lints]
workspace = true
