name: Segul-Tests

on: push

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: 
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run cargo check
        run: cargo check --workspace

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: 
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
          - windows-11-arm

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run cargo test
        run: cargo test --workspace

  features:
    name: Core Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "align", "sequence", "read", "contig", "maf"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Check segul-core with selected features
        run: cargo check -p segul-core --all-targets --no-default-features --features "${{ matrix.features }}"

  bioconda:
    name: Bioconda Install Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install the way the bioconda recipe does
        run: cargo install --no-track --locked --root "$RUNNER_TEMP/bc" --path .

      - name: Run installed binary
        run: |
          "$RUNNER_TEMP/bc/bin/segul" --version
          "$RUNNER_TEMP/bc/bin/segul" --help
