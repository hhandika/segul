# Real datasets are read from a local directory and skipped when it is missing.
# For example, the alignments used in the SEGUL paper:
#
# [[datasets]]
# id = "oliveros-2019"
# kind = "real"
# path = "~/data/oliveros-2019/nexus"
# description = "Oliveros et al. 2019 (522.5 MBases, DNA)"
[[datasets]]
id = "esselstyn-2021"
kind = "real"
path = "~/Documents/segul-test-datasets/esselstyn_2021_nexus_trimmed"
description = "Esselstyn et al. 2021 (358.1 MBases, DNA)"

# Tasks ------------------------------------------------------------------
#
# `args` are passed to segul. `{input}` is the dataset directory and
# `{output}` a fresh output directory for each run. `min_version` skips
# releases that lack the command.

[[tasks]]
id = "esselstyn-2021-concat"
label = "Concatenate Esselstyn et al. 2021"
dataset = "esselstyn-2021"
args = ["align", "concat", "-d", "{input}", "-f", "nexus", "-o", "{output}"]

[[tasks]]
id = "esselstyn-2021-convert"
label = "Convert Esselstyn et al. 2021"
dataset = "esselstyn-2021"
args = [
    "align",
    "convert",
    "-d",
    "{input}",
    "-f",
    "nexus",
    "-F",
    "fasta",
    "-o",
    "{output}",
]

[[tasks]]
id = "esselstyn-2021-summary"
label = "Summarize Esselstyn et al. 2021"
dataset = "esselstyn-2021"
args = ["align", "summary", "-d", "{input}", "-f", "nexus", "-o", "{output}"]

