# Real datasets are read from a local directory and skipped when it is missing.
# These are the alignments used in the SEGUL paper (Handika and Esselstyn
# 2024), kept in ~/Documents/segul-test-datasets. `name` is used in task labels,
# `datatype` is passed to tasks as {datatype}, `bases` is the total sequence
# length (base pairs, or residues for AA) shown in plot labels, and `vars`
# adds placeholders for task args (values may use {input}, the dataset folder).

# Locus alignments (one NEXUS file per locus) -----------------------------
#
# As in segul-bench (Handika and Esselstyn 2024), concatenation, conversion,
# and summary statistics run on folders of per-locus NEXUS files. The Chan et
# al. 2020 loci were split from the combined alignment below.

[[datasets]]
id = "esselstyn-2021"
name = "Esselstyn et al. 2021"
kind = "real"
datatype = "dna"
bases = 358100000
path = "~/Documents/segul-test-datasets/esselstyn_2021_nexus_trimmed"
description = "Esselstyn et al. 2021 (358.1 MBases, DNA)"

[[datasets]]
id = "jarvis-2014"
name = "Jarvis et al. 2014"
kind = "real"
datatype = "dna"
bases = 453300000
path = "~/Documents/segul-test-datasets/jarvis_2014_uce_filtered_w_gator"
description = "Jarvis et al. 2014 (453.3 MBases, DNA)"

[[datasets]]
id = "oliveros-2019"
name = "Oliveros et al. 2019"
kind = "real"
datatype = "dna"
bases = 522500000
path = "~/Documents/segul-test-datasets/oliveros_2019_80p_trimmed"
description = "Oliveros et al. 2019 (522.5 MBases, DNA)"

[[datasets]]
id = "chan-2020-loci"
name = "Chan et al. 2020"
kind = "real"
datatype = "dna"
bases = 239300000
path = "~/Documents/segul-test-datasets/chan_2020_loci"
description = "Chan et al. 2020 (239.3 MBases, DNA)"

[[datasets]]
id = "shen-2018"
name = "Shen et al. 2018"
kind = "real"
datatype = "aa"
bases = 398800000
path = "~/Documents/segul-test-datasets/shen_2018_loci_aa"
description = "Shen et al. 2018 (398.8 MBases, AA)"

[[datasets]]
id = "wu-2018-loci"
name = "Wu et al. 2018"
kind = "real"
datatype = "aa"
bases = 257100000
path = "~/Documents/segul-test-datasets/wu_2018_aa_loci"
description = "Wu et al. 2018 (257.1 MBases, AA)"

# Concatenated alignments with partitions ---------------------------------
# Used for splitting, as in segul-bench.
# These folders also hold macOS `._*` files, so tasks read the alignment
# file with -i instead of scanning the folder with -d.

[[datasets]]
id = "chan-2020-concat"
name = "Chan et al. 2020"
kind = "real"
datatype = "dna"
bases = 239300000
path = "~/Documents/segul-test-datasets/chan_2020_all_combined"
description = "Chan et al. 2020 (239.3 MBases, DNA), concatenated"
vars = { alignment = "{input}/alignment_all-combined.phy", format = "phylip", partition = "{input}/partitions_all-combined.txt", partition_format = "raxml" }

[[datasets]]
id = "wu-2018-concat"
name = "Wu et al. 2018"
kind = "real"
datatype = "aa"
bases = 257100000
path = "~/Documents/segul-test-datasets/wu_2018_aa"
description = "Wu et al. 2018 (257.1 MBases, AA), concatenated"
vars = { alignment = "{input}/alignment.nex", format = "nexus", partition = "{input}/alignment_partition.nex", partition_format = "nexus" }

# Tasks ------------------------------------------------------------------
#
# `args` are passed to segul. `{input}` is the dataset folder, `{output}` a
# fresh output directory for each run, and `{datatype}` plus any dataset
# `vars` come from the dataset. With `datasets = [...]`, the task runs once
# per dataset, with id "<dataset>-<id>" and label "<label> <dataset name>".
# `min_version` skips releases that lack the command.

[[tasks]]
id = "concat"
label = "Concatenate"
datasets = [
    "esselstyn-2021",
    "jarvis-2014",
    "oliveros-2019",
    "chan-2020-loci",
    "shen-2018",
    "wu-2018-loci",
]
args = [
    "align",
    "concat",
    "-d",
    "{input}",
    "-f",
    "nexus",
    "--datatype",
    "{datatype}",
    "-o",
    "{output}",
]

[[tasks]]
id = "convert"
label = "Convert"
datasets = [
    "esselstyn-2021",
    "jarvis-2014",
    "oliveros-2019",
    "chan-2020-loci",
    "shen-2018",
    "wu-2018-loci",
]
args = [
    "align",
    "convert",
    "-d",
    "{input}",
    "-f",
    "nexus",
    "-F",
    "fasta",
    "--datatype",
    "{datatype}",
    "-o",
    "{output}",
]

[[tasks]]
id = "summary"
label = "Summarize"
datasets = [
    "esselstyn-2021",
    "jarvis-2014",
    "oliveros-2019",
    "chan-2020-loci",
    "shen-2018",
    "wu-2018-loci",
]
args = [
    "align",
    "summary",
    "-d",
    "{input}",
    "-f",
    "nexus",
    "--datatype",
    "{datatype}",
    "-o",
    "{output}",
]

[[tasks]]
id = "split"
label = "Split"
datasets = ["chan-2020-concat"]
args = [
    "align",
    "split",
    "-i",
    "{alignment}",
    "-f",
    "{format}",
    "-I",
    "{partition}",
    "-p",
    "{partition_format}",
    "--datatype",
    "{datatype}",
    "-o",
    "{output}",
]

# The Wu et al. 2018 partition file lists charsets out of order, which the
# default partition check rejects. Splitting does not need them in order.
[[tasks]]
id = "split"
label = "Split"
datasets = ["wu-2018-concat"]
args = [
    "align",
    "split",
    "-i",
    "{alignment}",
    "-f",
    "{format}",
    "-I",
    "{partition}",
    "-p",
    "{partition_format}",
    "--skip-checking",
    "--datatype",
    "{datatype}",
    "-o",
    "{output}",
]

