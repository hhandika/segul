# segul-bench configuration.
#
# Versions are release tags (downloaded from GitHub releases) or `current`
# (the working tree, built with `cargo build --release`), oldest first.
# Results are reported relative to the first version.

[defaults]
versions = ["v0.22.1", "v0.23.2", "current"]
replicates = 5
warmup = 1
scale = "full"
# Flag `current` when it is this much slower or larger than the previous version.
regression_threshold = 0.05

# Datasets ---------------------------------------------------------------
#
# Synthetic datasets are generated once into .cache/data/<scale>/<id>/ with a
# fixed seed. `params.small` is for quick checks, `params.full` for results.

